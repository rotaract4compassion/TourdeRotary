<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Tour de Rotary DSM - Sign Up</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Anton&amp;family=Hanken+Grotesk:wght@400;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-secondary-fixed": "#291800",
                        "outline-variant": "#c2c6d2",
                        "surface-container-low": "#f3f3f4",
                        "inverse-surface": "#2f3131",
                        "surface": "#f9f9f9",
                        "on-error-container": "#93000a",
                        "secondary-fixed": "#ffddb3",
                        "on-primary-fixed": "#001b3b",
                        "on-surface-variant": "#424750",
                        "on-tertiary-fixed-variant": "#900038",
                        "on-error": "#ffffff",
                        "background": "#f9f9f9",
                        "primary-container": "#004687",
                        "on-tertiary-fixed": "#400014",
                        "on-primary": "#ffffff",
                        "secondary-fixed-dim": "#ffb950",
                        "on-secondary-container": "#6b4500",
                        "inverse-primary": "#a7c8ff",
                        "primary-fixed-dim": "#a7c8ff",
                        "surface-container": "#eeeeee",
                        "secondary": "#825500",
                        "surface-container-high": "#e8e8e8",
                        "outline": "#737781",
                        "on-secondary-fixed-variant": "#624000",
                        "error": "#ba1a1a",
                        "surface-container-lowest": "#ffffff",
                        "surface-bright": "#f9f9f9",
                        "on-tertiary-container": "#ff95a8",
                        "on-primary-fixed-variant": "#014788",
                        "on-primary-container": "#87b6fe",
                        "on-surface": "#1a1c1c",
                        "tertiary-container": "#8f0037",
                        "primary-fixed": "#d5e3ff",
                        "tertiary-fixed": "#ffd9de",
                        "on-tertiary": "#ffffff",
                        "primary": "#00305f",
                        "on-background": "#1a1c1c",
                        "tertiary-fixed-dim": "#ffb2be",
                        "surface-tint": "#2b5fa1",
                        "surface-container-highest": "#e2e2e2",
                        "error-container": "#ffdad6",
                        "secondary-container": "#feae23",
                        "surface-variant": "#e2e2e2",
                        "surface-dim": "#dadada",
                        "on-secondary": "#ffffff",
                        "tertiary": "#650025",
                        "inverse-on-surface": "#f0f1f1"
                    },
                    borderRadius: {
                        DEFAULT: "0.25rem",
                        lg: "0.5rem",
                        xl: "0.75rem",
                        full: "9999px"
                    },
                    spacing: {
                        "margin-mobile": "20px",
                        "unit": "8px",
                        "margin-desktop": "64px",
                        "diagonal-offset": "12deg",
                        "gutter": "24px"
                    },
                    fontFamily: {
                        "body-md": ["Hanken Grotesk"],
                        "headline-md": ["Hanken Grotesk"],
                        "headline-lg": ["Anton"],
                        "data-metric": ["Anton"],
                        "display-hero": ["Anton"],
                        "label-ui": ["JetBrains Mono"],
                        "headline-lg-mobile": ["Anton"],
                        "body-lg": ["Hanken Grotesk"]
                    },
                    fontSize: {
                        "body-md": ["16px", { lineHeight: "150%", fontWeight: "400" }],
                        "headline-md": ["32px", { lineHeight: "120%", fontWeight: "800" }],
                        "headline-lg": ["64px", { lineHeight: "100%", fontWeight: "400" }],
                        "data-metric": ["48px", { lineHeight: "100%", fontWeight: "400" }],
                        "display-hero": ["96px", { lineHeight: "90%", letterSpacing: "-0.02em", fontWeight: "400" }],
                        "label-ui": ["14px", { lineHeight: "100%", letterSpacing: "0.05em", fontWeight: "500" }],
                        "headline-lg-mobile": ["40px", { lineHeight: "100%", fontWeight: "400" }],
                        "body-lg": ["20px", { lineHeight: "160%", fontWeight: "400" }]
                    }
                }
            }
        }
    </script>
<style>
        .clip-diagonal {
            clip-path: polygon(0 0, 100% 0, 100% 100%, 12% 100%);
        }
        @media (max-width: 1024px) {
            .clip-diagonal {
                clip-path: polygon(0 0, 100% 0, 100% 90%, 0 100%);
            }
        }
        .input-underline {
            background-color: transparent;
            border: none;
            border-bottom: 2px solid #00305f; /* primary */
            border-radius: 0;
            padding: 8px 0;
            outline: none;
            box-shadow: none;
        }
        .input-underline:focus {
            border-bottom-color: #feae23; /* secondary-container / Gold */
            box-shadow: none;
        }
        .input-label {
            transition: all 0.2s ease-out;
        }
        .input-group:focus-within .input-label {
            color: #feae23;
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen overflow-x-hidden flex flex-col lg:flex-row">
<!-- Left Side: Cinematic Image (Desktop Only) -->
<div class="relative w-full lg:w-3/5 min-h-[409px] lg:min-h-screen">
<div class="absolute inset-0 bg-cover bg-center w-full h-full" data-alt="A cinematic, wide-angle photograph of professional cyclists riding along the beautiful coastline of Dar es Salaam at sunrise. The golden hour light casts long dramatic shadows, highlighting the energy and speed of the riders. The Indian Ocean stretches out in the background, sparkling in the early morning sun. The image evokes a sense of elite athletic performance and coastal vitality, fitting a high-end sports editorial style." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBtwGgKZYB9RO-8OjadDXwx_3lA3SGuAX498SozN1H_CqehU4pl5gn-Xyic3Yy34JMyrCLhO3vrjb8DA1oKPAJ-NVguhsgzY1ldP-k03Yaukiy8XeGsrTai8yciqmBiFROJagZGgt2bJA9TQaY_WseYZyvcXsPY2S12a4vnS6sjXtX4O191w2EEzaRy_FChfSGF-v4-npwydq-07-GUiNNGKp6wTjOhK0e7hTkwFqdVnwzJL0emPcdDFw')"></div>
<div class="absolute inset-0 bg-primary/20 mix-blend-multiply"></div> <!-- Subtle brand overlay -->
<!-- Large watermark logo (simulated) -->
<div class="absolute inset-0 flex items-center justify-center opacity-10 pointer-events-none">
<span class="material-symbols-outlined text-[300px] text-on-primary" style="font-variation-settings: 'FILL' 1;">directions_bike</span>
</div>
</div>
<!-- Right Side: Authentication Form -->
<div class="w-full lg:w-2/5 bg-surface-container-lowest min-h-screen flex flex-col justify-center px-margin-mobile lg:px-margin-desktop py-12 lg:py-0 relative z-10 lg:-ml-12 lg:clip-diagonal shadow-2xl">
<div class="w-full max-w-md mx-auto lg:pl-12">
<!-- Brand Header -->
<div class="mb-12">
<h1 class="text-headline-lg-mobile md:text-headline-lg font-headline-lg text-primary uppercase tracking-tighter leading-none mb-4">Register for the Tour</h1>
<p class="text-body-md font-body-md text-on-surface-variant">Join the elite peloton. Enter your details to create your rider profile.</p>
</div>
<!-- Form -->
<form class="space-y-8">
<!-- Name Field -->
<div class="input-group relative flex flex-col">
<label class="text-label-ui font-label-ui text-primary uppercase mb-1 input-label" for="name">Full Name</label>
<input class="input-underline w-full text-body-lg font-body-lg text-on-surface" id="name" name="name" placeholder="Eliud Kipchoge" required="" type="text"/>
</div>
<!-- Email Field -->
<div class="input-group relative flex flex-col">
<label class="text-label-ui font-label-ui text-primary uppercase mb-1 input-label" for="email">Email Address</label>
<input class="input-underline w-full text-body-lg font-body-lg text-on-surface" id="email" name="email" placeholder="rider@example.com" required="" type="email"/>
</div>
<!-- Phone Field -->
<div class="input-group relative flex flex-col">
<label class="text-label-ui font-label-ui text-primary uppercase mb-1 input-label" for="phone">Phone Number</label>
<input class="input-underline w-full text-body-lg font-body-lg text-on-surface" id="phone" name="phone" placeholder="+255 123 456 789" type="tel"/>
</div>
<!-- Password Field -->
<div class="input-group relative flex flex-col">
<label class="text-label-ui font-label-ui text-primary uppercase mb-1 input-label" for="password">Password</label>
<input class="input-underline w-full text-body-lg font-body-lg text-on-surface" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Terms Checkbox -->
<div class="flex items-start gap-3 mt-6">
<div class="flex items-center h-5">
<input class="w-5 h-5 border-2 border-primary rounded-none text-primary focus:ring-secondary-container bg-transparent" id="terms" name="terms" required="" type="checkbox"/>
</div>
<div class="text-sm">
<label class="font-body-md text-on-surface-variant" for="terms">I agree to the <a class="text-primary font-bold hover:text-secondary-container transition-colors" href="#">Terms and Conditions</a> and <a class="text-primary font-bold hover:text-secondary-container transition-colors" href="#">Privacy Policy</a>.</label>
</div>
</div>
<!-- Primary CTA -->
<button class="w-full bg-secondary-container text-on-primary-fixed font-headline-lg text-headline-md uppercase py-4 px-8 mt-8 hover:bg-primary hover:text-on-primary transition-colors duration-300 flex items-center justify-center gap-2 group" type="submit">
<span>Create Account</span>
<span class="material-symbols-outlined transform group-hover:translate-x-2 transition-transform duration-300">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="relative my-8">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-surface-container-lowest text-on-surface-variant font-label-ui text-label-ui uppercase">Or continue with</span>
</div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 w-full px-4 py-3 border-2 border-primary text-primary font-body-md font-bold hover:bg-surface-container-low transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">login</span> <!-- Simulating Google Icon -->
                    Google
                </button>
<button class="flex items-center justify-center gap-2 w-full px-4 py-3 border-2 border-primary text-primary font-body-md font-bold hover:bg-surface-container-low transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">qr_code_2</span> <!-- Simulating FB Icon -->
                    Facebook
                </button>
</div>
<p class="mt-8 text-center text-body-md font-body-md text-on-surface-variant">
                Already have an account? <a class="text-primary font-bold hover:text-secondary-container transition-colors" href="#">Log In</a>
</p>
</div>
</div>
</body></html>
